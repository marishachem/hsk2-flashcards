<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 2 Flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f4f6fb;
    --bg2: #ffffff;
    --fg: #1a1a2e;
    --fg2: #6b7280;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --gold: #f39c12;
    --green: #27ae60;
    --border: #dce3f0;
    --card-shadow: 0 8px 40px rgba(37,99,235,0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1320; --bg2: #1a2035; --fg: #f0eee8;
      --fg2: #9ca3af; --border: #253060;
      --card-shadow: 0 8px 40px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1320; --bg2: #1a2035; --fg: #f0eee8;
    --fg2: #9ca3af; --border: #253060;
    --card-shadow: 0 8px 40px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    padding-inline: 16px;
    padding-block: 24px;
    overflow-x: hidden;
  }

  .app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; width: 100%; }
  *, *::before, *::after { max-width: 100%; }

  .header { text-align: center; }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .header h1 span { color: var(--accent); }
  .subtitle { font-size: .85rem; color: var(--fg2); margin-top: 4px; }

  .modes {
    display: flex; gap: 6px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 5px;
  }
  .mode-btn {
    flex: 1; padding: 7px; border: none; border-radius: 8px;
    font-size: .8rem; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--fg2);
    transition: background .2s, color .2s;
    font-family: 'Inter', sans-serif;
  }
  .mode-btn.active { background: var(--accent); color: #fff; }

  .progress-row {
    display: flex; align-items: center; gap: 10px;
    font-size: .8rem; color: var(--fg2);
  }
  .progress-bar {
    flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent); border-radius: 999px;
    transition: width .4s ease;
  }

  .score-row { display: flex; gap: 10px; }
  .score-card {
    flex: 1; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; text-align: center;
  }
  .score-val { font-size: 1.3rem; font-weight: 700; }
  .score-label { font-size: .7rem; color: var(--fg2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .score-know .score-val { color: var(--green); }
  .score-learn .score-val { color: var(--accent); }
  .score-left .score-val { color: var(--gold); }

  .card-wrap { perspective: 1000px; }
  .card {
    width: 100%; min-height: 480px;
    position: relative; cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 48px 28px 28px;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-front { justify-content: center; }
  .card-back { transform: rotateY(180deg); }

  .card-hint {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: .72rem; color: var(--fg2); letter-spacing: .08em;
    text-transform: uppercase; font-weight: 600; white-space: nowrap;
  }
  .card-tag {
    position: absolute; top: 14px; right: 16px;
    font-size: .7rem; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: var(--border); color: var(--fg2);
  }

  .chinese { font-family: 'Noto Sans SC', sans-serif; font-size: 5rem; font-weight: 700; line-height: 1; color: var(--fg); }
  .pinyin { font-size: 1.3rem; color: var(--accent); margin-top: 10px; font-weight: 500; }
  .english { font-size: 1.25rem; font-weight: 600; color: var(--fg); text-align: center; }

  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: .9rem; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: transform .15s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-know { background: var(--green); color: #fff; }
  .btn-learn { background: var(--accent); color: #fff; }
  .btn-skip {
    flex: 0 0 auto; padding: 14px 18px;
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--fg2);
  }

  .flip-hint { font-size: .75rem; color: var(--fg2); text-align: center; }

  .btn-undo {
    background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 18px;
    font-size: .8rem; font-weight: 600; color: var(--fg2);
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: border-color .2s, color .2s;
  }
  .btn-undo:hover { border-color: var(--accent); color: var(--accent); }

  .sound-btn {
    position: absolute; bottom: 14px; right: 16px;
    background: var(--border); border: none; border-radius: 50%;
    width: 36px; height: 36px; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .sound-btn:hover { background: var(--accent); }
  .sound-btn:active { transform: scale(.9); }
  .sound-btn.playing { background: var(--accent); animation: pulse .4s ease; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

  .autoplay-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: .78rem; color: var(--fg2);
    margin-bottom: 12px;
  }
  .toggle {
    width: 36px; height: 20px; background: var(--border); border-radius: 999px;
    border: none; cursor: pointer; position: relative; transition: background .2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content:''; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; background: #fff; border-radius: 50%;
    transition: left .2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 19px; }

  .word-list { display: flex; flex-direction: column; gap: 6px; }
  .word-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
    transition: border-color .2s;
  }
  .word-row:hover { border-color: var(--accent); }
  .word-row.known { border-left: 3px solid var(--green); }
  .word-row.tolearn { border-left: 3px solid var(--accent); }
  .w-char { font-family: 'Noto Sans SC', sans-serif; font-size: 1.5rem; font-weight: 700; min-width: 48px; }
  .w-pin { font-size: .85rem; color: var(--accent); font-weight: 500; min-width: 90px; }
  .w-en { font-size: .85rem; color: var(--fg2); flex: 1; min-width: 0; }
  #b-gifs img { max-width: min(130px, 40vw); }
  .w-badge {
    font-size: .65rem; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; flex-shrink: 0;
  }
  .w-badge.known { background: #d1fae5; color: #065f46; }
  .w-badge.tolearn { background: #dbeafe; color: #1e40af; }

  .list-search {
    padding: 9px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: .88rem;
    background: var(--bg2); color: var(--fg);
    font-family: 'Inter', sans-serif; width: 100%;
    outline: none;
  }
  .list-search:focus { border-color: var(--accent); }

  .finish { text-align: center; padding: 40px 20px; }
  .finish-emoji { font-size: 4rem; }
  .finish h2 { font-size: 1.5rem; font-weight: 700; margin: 12px 0 6px; }
  .finish p { color: var(--fg2); margin-bottom: 20px; }
  .btn-restart {
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px; padding: 12px 28px;
    font-size: .95rem; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<div class="app">
  <div class="header">
    <h1>HSK 2 <span>闪卡</span> Flashcards</h1>
    <div class="subtitle">New HSK 3.0 · ~200 words · Tap card to flip · Mark what you know</div>
  </div>

  <div class="modes">
    <button class="mode-btn active" onclick="setMode('all')">All words</button>
    <button class="mode-btn" onclick="setMode('learn')">Study again</button>
    <button class="mode-btn" onclick="setMode('list')">Word list</button>
  </div>

  <div class="score-row">
    <div class="score-card score-know"><div class="score-val" id="s-know">0</div><div class="score-label">✅ Know</div></div>
    <div class="score-card score-learn"><div class="score-val" id="s-learn">0</div><div class="score-label">🔄 Review</div></div>
    <div class="score-card score-left"><div class="score-val" id="s-left">202</div><div class="score-label">📚 Left</div></div>
  </div>

  <div id="reset-row" style="text-align:center;">
    <button class="btn-undo" onclick="showResetConfirm()" style="font-size:.72rem;padding:5px 14px;">🗑 Reset progress</button>
  </div>
  <div id="reset-confirm" style="display:none;text-align:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
    <div style="font-size:.85rem;margin-bottom:10px;">Reset all progress? This cannot be undone.</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="btn-undo" onclick="cancelReset()" style="padding:6px 18px;">Cancel</button>
      <button class="btn-undo" onclick="confirmReset()" style="padding:6px 18px;border-color:#ef4444;color:#ef4444;">Yes, reset</button>
    </div>
  </div>

  <!-- Card mode -->
  <div id="card-mode">
    <div class="progress-row">
      <span id="prog-text">1 / 202</span>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div class="card-wrap">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="card-hint">HSK 2 — Tap to flip</div>
          <div class="card-tag" id="card-tag"></div>
          <div class="chinese" id="f-char"></div>
          <div class="pinyin" id="f-pin"></div>
          <button class="sound-btn" id="sound-btn" onclick="event.stopPropagation();speak()">🔊</button>
        </div>
        <div class="card-face card-back">
          <div class="card-hint">HSK 2</div>
          <div class="card-tag" id="card-tag-b"></div>
          <div class="chinese" id="b-char"></div>
          <div class="pinyin" id="b-pin"></div>
          <div class="english" id="b-en"></div>
          <div id="b-stroke" style="margin-top:14px;width:100%;text-align:center;display:none;">
            <div style="font-size:.7rem;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">✍️ Stroke order</div>
            <div id="b-gifs" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;"></div>
          </div>
          <div id="b-sentence" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);width:100%;text-align:center;">
            <div id="b-sent-zh" style="font-family:'Noto Sans SC',sans-serif;font-size:1rem;font-weight:700;margin-bottom:4px;"></div>
            <div id="b-sent-pin" style="font-size:.8rem;color:var(--accent);margin-bottom:4px;"></div>
            <div id="b-sent-en" style="font-size:.8rem;color:var(--fg2);font-style:italic;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="flip-hint" id="flip-hint">Tap the card to see the meaning</div>
    <div class="autoplay-row">
      <button class="toggle on" id="autoplay-toggle" onclick="toggleAutoplay()"></button>
      <span>Auto-play pronunciation</span>
    </div>

    <div class="actions" id="answer-btns" style="display:none;">
      <button class="btn btn-learn" onclick="markLearn()">🔄 Review again</button>
      <button class="btn btn-know" onclick="markKnow()">✅ I know it</button>
    </div>

    <div id="undo-row" style="display:none;text-align:center;">
      <button class="btn-undo" onclick="undoLast()">↩ Undo last</button>
    </div>

    <div class="actions" id="flip-btns">
      <button class="btn btn-skip" onclick="prev()" id="prev-btn">←</button>
      <button class="btn" onclick="flipCard()" style="background:var(--accent);color:#fff;">Flip</button>
      <button class="btn btn-skip" onclick="next()" id="next-btn">→</button>
    </div>

    <div id="finish-screen" class="finish" style="display:none;">
      <div class="finish-emoji">🎉</div>
      <h2>Deck complete!</h2>
      <p id="finish-msg"></p>
      <button class="btn-restart" onclick="restart()">Start over</button>
    </div>
  </div>

  <!-- List mode -->
  <div id="list-mode" style="display:none;">
    <input class="list-search" id="list-search" placeholder="Search characters, pinyin or English…" oninput="renderList()">
    <div class="word-list" id="word-list"></div>
  </div>
</div>

const GIFS = {};

let deck = [], idx = 0, flipped = false;
let known = new Set(), toLearn = new Set();
let mode = 'all';
let lastAction = null;

function loadState() {
  try {
    const k = localStorage.getItem('hsk2-known');
    const l = localStorage.getItem('hsk2-learn');
    if (k) known = new Set(JSON.parse(k));
    if (l) toLearn = new Set(JSON.parse(l));
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('hsk2-known', JSON.stringify([...known]));
    localStorage.setItem('hsk2-learn', JSON.stringify([...toLearn]));
  } catch(e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  if (mode === 'learn') {
    deck = shuffle(WORDS.filter(w => toLearn.has(w[0])));
  } else {
    deck = shuffle([...WORDS]);
  }
  idx = 0;
}

function setMode(m) {
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', ['all','learn','list'][i] === m));
  mode = m;
  document.getElementById('card-mode').style.display = m === 'list' ? 'none' : '';
  document.getElementById('list-mode').style.display = m === 'list' ? '' : 'none';
  if (m === 'list') { renderList(); return; }
  buildDeck();
  showCard();
}

function showCard() {
  const fin = document.getElementById('finish-screen');
  const wrap = document.querySelector('.card-wrap');
  const actions = document.getElementById('answer-btns');
  const flipBtns = document.getElementById('flip-btns');
  const hint = document.getElementById('flip-hint');

  if (!deck.length) {
    fin.style.display = '';
    wrap.style.display = 'none';
    actions.style.display = 'none';
    flipBtns.style.display = 'none';
    hint.style.display = 'none';
    document.getElementById('finish-msg').textContent = mode === 'learn'
      ? 'No words marked for review yet! Study some cards first.'
      : `You know ${known.size} of ${WORDS.length} words. Keep going!`;
    return;
  }

  fin.style.display = 'none';
  wrap.style.display = '';
  flipBtns.style.display = '';
  actions.style.display = 'none';
  hint.style.display = '';

  const w = deck[idx];
  document.getElementById('f-char').textContent = w[0];
  document.getElementById('f-pin').textContent = w[1];
  document.getElementById('b-char').textContent = w[0];
  document.getElementById('b-pin').textContent = w[1];
  document.getElementById('b-en').textContent = w[2];

  const strokeEl = document.getElementById('b-stroke');
  const gifsEl = document.getElementById('b-gifs');
  const gifUrls = getGifUrls(w[0]);
  gifsEl.innerHTML = '';
  gifUrls.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'stroke order';
    img.style.cssText = 'max-width:130px;border-radius:8px;border:1px solid var(--border);display:none;';
    img.onload = () => { img.style.display = ''; };
    img.onerror = () => { img.remove(); if (!gifsEl.children.length) strokeEl.style.display = 'none'; };
    gifsEl.appendChild(img);
  });
  strokeEl.style.display = '';

  const s = SENTENCES[w[0]];
  if (s) {
    document.getElementById('b-sent-zh').textContent = s[0];
    document.getElementById('b-sent-pin').textContent = s[1];
    document.getElementById('b-sent-en').textContent = s[2];
    document.getElementById('b-sentence').style.display = '';
  } else {
    document.getElementById('b-sentence').style.display = 'none';
  }

  const tag = known.has(w[0]) ? '✅' : toLearn.has(w[0]) ? '🔄' : '';
  document.getElementById('card-tag').textContent = tag;

  document.getElementById('prog-text').textContent = `${idx+1} / ${deck.length}`;
  if (autoplay) setTimeout(() => speak(w[0]), 300);
  document.getElementById('prog-fill').style.width = `${((idx+1)/deck.length)*100}%`;

  const card = document.getElementById('card');
  card.classList.remove('flipped');
  flipped = false;
  updateScores();
}

function flipCard() {
  const card = document.getElementById('card');
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  document.getElementById('answer-btns').style.display = flipped ? '' : 'none';
  document.getElementById('flip-btns').style.display = flipped ? 'none' : '';
  document.getElementById('flip-hint').style.display = flipped ? 'none' : '';
}

function markKnow() {
  const w = deck[idx][0];
  lastAction = { word: w, wasKnown: known.has(w), wasLearn: toLearn.has(w), idx };
  known.add(w); toLearn.delete(w);
  saveState(); next();
  document.getElementById('undo-row').style.display = '';
}

function markLearn() {
  const w = deck[idx][0];
  lastAction = { word: w, wasKnown: known.has(w), wasLearn: toLearn.has(w), idx };
  toLearn.add(w);
  saveState(); next();
  document.getElementById('undo-row').style.display = '';
}

function undoLast() {
  if (!lastAction) return;
  const { word, wasKnown, wasLearn, idx: prevIdx } = lastAction;
  if (wasKnown) known.add(word); else known.delete(word);
  if (wasLearn) toLearn.add(word); else toLearn.delete(word);
  saveState();
  idx = prevIdx;
  lastAction = null;
  document.getElementById('undo-row').style.display = 'none';
  showCard();
}

function next() {
  if (idx < deck.length - 1) { idx++; showCard(); }
  else {
    document.getElementById('finish-screen').style.display = '';
    document.querySelector('.card-wrap').style.display = 'none';
    document.getElementById('answer-btns').style.display = 'none';
    document.getElementById('flip-btns').style.display = 'none';
    document.getElementById('flip-hint').style.display = 'none';
    document.getElementById('finish-msg').textContent =
      `You know ${known.size} / ${WORDS.length} words. ${known.size >= WORDS.length ? '🏆 Perfect score!' : 'Keep practicing!'}`;
  }
  updateScores();
}

function prev() {
  if (idx > 0) { idx--; lastAction = null; document.getElementById('undo-row').style.display = 'none'; showCard(); }
}

function restart() { buildDeck(); showCard(); }

function showResetConfirm() {
  document.getElementById('reset-confirm').style.display = '';
  document.getElementById('reset-row').style.display = 'none';
}
function cancelReset() {
  document.getElementById('reset-confirm').style.display = 'none';
  document.getElementById('reset-row').style.display = '';
}
function confirmReset() {
  try { localStorage.removeItem('hsk2-known'); localStorage.removeItem('hsk2-learn'); } catch(e) {}
  known = new Set(); toLearn = new Set();
  cancelReset();
  buildDeck(); showCard();
}

function updateScores() {
  document.getElementById('s-know').textContent = known.size;
  document.getElementById('s-learn').textContent = toLearn.size;
  document.getElementById('s-left').textContent = WORDS.length - known.size - toLearn.size;
}

function renderList() {
  const q = document.getElementById('list-search').value.toLowerCase();
  const list = document.getElementById('word-list');
  list.innerHTML = '';
  WORDS.filter(w => !q || w[0].includes(q) || w[1].toLowerCase().includes(q) || w[2].toLowerCase().includes(q))
    .forEach(w => {
      const isKnown = known.has(w[0]), isLearn = toLearn.has(w[0]);
      const row = document.createElement('div');
      row.className = 'word-row' + (isKnown ? ' known' : isLearn ? ' tolearn' : '');
      row.innerHTML = `
        <div class="w-char">${w[0]}</div>
        <div class="w-pin">${w[1]}</div>
        <div class="w-en">${w[2]}</div>
        ${isKnown ? '<span class="w-badge known">Know</span>' : isLearn ? '<span class="w-badge tolearn">Review</span>' : ''}
      `;
      list.appendChild(row);
    });
}

document.addEventListener('keydown', e => {
  if (document.getElementById('list-mode').style.display !== 'none') return;
  if (e.key === ' ' || e.key === 'f') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (flipped) {
    if (e.key === '1') markLearn();
    if (e.key === '2') markKnow();
  }
});

const WC_BASE = 'https://dictionary.writtenchinese.com/giffile.action?&localfile=true&fileName=';
function getGifUrls(word) {
  const g = GIFS[word];
  if (Array.isArray(g)) return g;
  if (g) return [g];
  return [...word].map(ch => WC_BASE + encodeURIComponent(ch) + '.gif');
}

let autoplay = true;
let zhVoice = null;

function loadVoice() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.startsWith('zh')) || null;
}
loadVoice();
speechSynthesis.onvoiceschanged = loadVoice;

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const word = text || deck[idx]?.[0];
  if (!word) return;
  speechSynthesis.cancel();
  const btn = document.getElementById('sound-btn');
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'zh-CN';
  utt.rate = 0.85;
  if (zhVoice) utt.voice = zhVoice;
  if (btn) { btn.classList.add('playing'); utt.onend = () => btn.classList.remove('playing'); }
  speechSynthesis.speak(utt);
}

function toggleAutoplay() {
  autoplay = !autoplay;
  document.getElementById('autoplay-toggle').classList.toggle('on', autoplay);
}

loadState();
buildDeck();
showCard();
</script>
